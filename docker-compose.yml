version: "3.9"
services:
  erp:
    build: .
    container_name: premier-erp
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - PORT=5050
      - JWT_KEY=${JWT_KEY:?set a long random secret, e.g. openssl rand -base64 48}
      # Same MySQL database the ISO/LMS backend uses. If MySQL runs on the
      # host machine (not in this compose file), DB_HOST=host.docker.internal
      # on Windows/Mac, or the host's LAN IP on Linux.
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?set the MySQL password}
      - DB_NAME=${DB_NAME:-ptis_erp_db}
      # Origins allowed to call this API cross-domain (the ERP front end
      # itself is served by this same container, so same-origin calls
      # never need this — only set it if something else calls the API
      # directly from another domain).
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # Outgoing mail (Payroll / Slips → Send Payslips) — optional: left
      # blank, Send Payslips reports a clear "mail not configured" error
      # instead of silently failing. Set these in THIS compose project's
      # own .env (next to this file, NOT backend/.env — that one's only
      # read when running `node server.js` directly, outside Docker).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    restart: unless-stopped
