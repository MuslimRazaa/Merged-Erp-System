name: Deploy Merged ERP to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}
            git fetch origin main
            git reset --hard origin/main

            cd backend
            source /home2/ptisco/nodevenv/erp-app/backend/22/bin/activate
            npm install --omit=dev
            touch tmp/restart.txt